<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReBoot モデルビューア</title>
<meta name="description" content="PlayStation 版 ReBoot のディスクイメージから、キャラクターの3Dモデルを取り出してブラウザで回して見るビューア（非公式）。">
<style>
  :root{
    --bg:#11131a; --panel:#1a1d26; --line:#2a2e3a; --fg:#e9e7e2; --dim:#98a0ae;
    --accent:#6fd3c7; --accent2:#f0b429; --warn:#e5736b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    overscroll-behavior:none;-webkit-text-size-adjust:100%}
  button,select{font-family:inherit}

  /* --- 最初の画面 --- */
  #intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:20;
    background:radial-gradient(1200px 700px at 50% -10%,#1e2433,var(--bg))}
  #introBox{max-width:620px;width:100%;text-align:center}
  #introBox h1{font-size:clamp(20px,5vw,30px);margin:0 0 6px;letter-spacing:.1em;color:var(--accent)}
  #introBox .lead{color:var(--dim);font-size:14px;line-height:1.9;margin:0 0 22px}
  #drop{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;transition:.15s;cursor:pointer;background:#161923}
  #drop.over{border-color:var(--accent);background:#17222a}
  #drop .big{font-size:15px;margin-bottom:10px}
  #drop .sm{font-size:12px;color:var(--dim);line-height:1.8}
  #pick{margin-top:16px;background:var(--accent);color:#0c1116;border:0;border-radius:9px;
    padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer}
  #note{margin-top:20px;font-size:11.5px;color:#7b8494;line-height:1.9}
  #status{margin-top:16px;font-size:13px;color:var(--accent2);min-height:1.4em}
  #status.bad{color:var(--warn)}

  /* --- 本体 --- */
  #app{display:none;height:100%}
  #app.on{display:flex}
  #view{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #side{width:272px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
  h2{font-size:13px;margin:0 0 2px;letter-spacing:.09em;color:var(--accent)}
  .sub{font-size:11px;color:var(--dim);margin:0}
  label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.06em}
  select,.btn{width:100%;background:#252934;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px 9px;font-size:13px}
  .btn{cursor:pointer;text-align:center}
  .btn:active{background:#30353f}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .meta{font-size:11px;color:var(--dim);line-height:1.75;border-top:1px solid var(--line);padding-top:10px}
  .meta b{color:var(--fg);font-weight:600}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;margin:0}
  #hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:#69707d;pointer-events:none}
  #busy{position:absolute;inset:0;display:none;place-items:center;background:rgba(17,19,26,.82);
    font-size:13px;color:var(--accent2)}
  #busy.on{display:grid}
  @media (max-width:760px){
    #app.on{flex-direction:column}
    #side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:46%}
    #hint{display:none}
  }
</style>
</head>
<body>

<div id="intro">
  <div id="introBox">
    <h1>REBOOT モデルビューア</h1>
    <p class="lead">PlayStation 版『ReBoot』（SLUS-00274）のディスクイメージから、<br>
      キャラクターの3Dモデルを取り出して回して見る（非公式）</p>
    <div id="drop">
      <div class="big">ここにディスクイメージを落とす</div>
      <div class="sm"><code>.chd</code>（MAME の圧縮形式・v5）／<code>.bin</code>（2352バイト/セクタ または 2048バイトの ISO）</div>
      <button id="pick">ファイルを選ぶ</button>
    </div>
    <div id="status"></div>
    <p id="note">ゲームのデータはこのページに一切含まれていない。<br>
      読み込んだファイルはブラウザの中だけで読み取り、どこにも送信しない。</p>
  </div>
</div>

<div id="app">
  <div id="view">
    <canvas id="gl"></canvas>
    <div id="hint">ドラッグで回転・ホイールで拡大</div>
    <div id="busy">読み込み中…</div>
  </div>
  <div id="side">
    <div>
      <h2>REBOOT モデルビューア</h2>
      <p class="sub" id="discName"></p>
    </div>
    <div><label>キャラクター</label><select id="model"></select></div>
    <div><label>動き</label><select id="anim"></select></div>
    <div class="row">
      <button class="btn" id="play">停止</button>
      <button class="btn" id="reset">向きを戻す</button>
    </div>
    <div>
      <label>コマ <span id="fno"></span></label>
      <input type="range" id="frame" min="0" max="0" value="0">
    </div>
    <div>
      <label>速さ <span id="spd">1.0×</span></label>
      <input type="range" id="speed" min="10" max="300" value="100">
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="wire"> 輪郭だけ</label>
      <label class="toggle"><input type="checkbox" id="smooth"> なめらか</label>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<input type="file" id="file" multiple accept=".chd,.bin,.iso,.img" style="display:none">

<script>
"use strict";
//  ディスクの読み取り
// ============================================================
class BinDisc{
  constructor(file){this.file=file}
  async init(){
    const head=new Uint8Array(await this.file.slice(0,16).arrayBuffer());
    const sync=head[0]===0&&head.slice(1,11).every(b=>b===0xff)&&head[11]===0;
    this.secSize=sync?2352:2048;
    this.dataOff=sync?(head[15]===2?24:16):0;
  }
  // 1セクタ 2352B そのまま（XA 音声用）。2048B の ISO では読めない
  async readRaw(lba){ return this.secSize===2352?new Uint8Array(await this.file.slice(lba*2352,(lba+1)*2352).arrayBuffer()):null }
  async read(lba,count){
    const raw=new Uint8Array(await this.file.slice(lba*this.secSize,(lba+count)*this.secSize).arrayBuffer());
    if(this.secSize===2048) return raw;
    const out=new Uint8Array(count*2048);
    for(let i=0;i<count;i++) out.set(raw.subarray(i*2352+this.dataOff,i*2352+this.dataOff+2048),i*2048);
    return out;
  }
  async rootFiles(){
    const pvd=await this.read(16,1);
    if(String.fromCharCode(...pvd.subarray(1,6))!=="CD001") throw new Error("ISO9660 のディスクイメージとして読めませんでした");
    const dv=new DataView(pvd.buffer);
    const lba=dv.getUint32(156+2,true), size=dv.getUint32(156+10,true);
    const buf=await this.read(lba,Math.ceil(size/2048)); const d=new DataView(buf.buffer);
    const files={}; let i=0;
    while(i<size){
      const len=buf[i]; if(len===0){i=(Math.floor(i/2048)+1)*2048; continue}
      const nl=buf[i+32]; const name=String.fromCharCode(...buf.subarray(i+33,i+33+nl)).split(";")[0];
      files[name]={lba:d.getUint32(i+2,true),size:d.getUint32(i+10,true)};
      i+=len;
    }
    return files;
  }
}
// ============================================================
//  CHD（MAME の圧縮ディスクイメージ、v5・CD）
// ============================================================
class MsbBits{
  constructor(d){this.d=d;this.pos=0}
  peek(n){let v=0;for(let i=0;i<n;i++){const p=this.pos+i;v=v*2+(((this.d[p>>3]||0)>>(7-(p&7)))&1)}return v}
  read(n){const v=this.peek(n);this.pos+=n;return v}
}
function huffmanFromRle(br,numcodes,maxbits){
  const nb=maxbits>=16?5:maxbits>=8?4:3, len=new Array(numcodes).fill(0);
  for(let cur=0;cur<numcodes;){
    let b=br.read(nb);
    if(b!==1){len[cur++]=b;continue}
    b=br.read(nb);
    if(b===1){len[cur++]=1;continue}
    for(let r=br.read(nb)+3;r>0&&cur<numcodes;r--) len[cur++]=b;
  }
  const hist=new Array(33).fill(0); for(const l of len) if(l) hist[l]++;
  let start=0; for(let l=32;l>0;l--){const next=(start+hist[l])>>1; hist[l]=start; start=next}
  const table=new Array(1<<maxbits).fill(0);
  len.forEach((l,sym)=>{ if(!l) return; const code=hist[l]++, sh=maxbits-l; for(let k=code<<sh;k<((code+1)<<sh);k++) table[k]=[sym,l] });
  return ()=>{const e=table[br.peek(maxbits)]; if(!e) throw new Error("CHD の目次が壊れています"); br.pos+=e[1]; return e[0]};
}
function lzmaDecode(src,outLen,lc=3,lp=0,pb=2){
  const out=new Uint8Array(outLen);
  let ip=5, range=0xFFFFFFFF, code=((src[1]<<24)>>>0)+(src[2]<<16)+(src[3]<<8)+src[4];
  const P=n=>new Uint16Array(n).fill(1024);
  const bit=(p,i)=>{
    const b=(range>>>11)*p[i]; let r;
    if(code<b){range=b; p[i]+=(2048-p[i])>>5; r=0} else {range-=b; code-=b; p[i]-=p[i]>>5; r=1}
    if(range<16777216){range*=256; code=code*256+(src[ip++]||0)}
    return r;
  };
  const tree=(p,base,n)=>{let m=1;for(let i=0;i<n;i++)m=(m<<1)+bit(p,base+m);return m-(1<<n)};
  const rtree=(p,base,n)=>{let m=1,s=0;for(let i=0;i<n;i++){const b=bit(p,base+m);m=(m<<1)+b;s|=b<<i}return s};
  const isMatch=P(192),isRep=P(12),isRepG0=P(12),isRepG1=P(12),isRepG2=P(12),isRep0Long=P(192);
  const posSlot=P(256),specPos=P(114),align=P(16),lenC=P(514),repLenC=P(514),lit=P(0x300<<(lc+lp));
  const len=(p,ps)=>!bit(p,0)?tree(p,2+(ps<<3),3):!bit(p,1)?8+tree(p,130+(ps<<3),3):16+tree(p,258,8);
  let state=0,r0=0,r1=0,r2=0,r3=0,op=0;
  const pbMask=(1<<pb)-1, lpMask=(1<<lp)-1;
  while(op<outLen){
    const ps=op&pbMask;
    if(!bit(isMatch,(state<<4)+ps)){
      const base=0x300*(((op&lpMask)<<lc)+((op?out[op-1]:0)>>(8-lc)));
      let s=1;
      if(state<7){ while(s<0x100) s=(s<<1)|bit(lit,base+s) }
      else{
        let mb=out[op-r0-1];
        while(s<0x100){ const m=(mb>>7)&1; mb<<=1; const b=bit(lit,base+0x100+(m<<8)+s); s=(s<<1)|b; if(m!==b){ while(s<0x100) s=(s<<1)|bit(lit,base+s); break } }
      }
      out[op++]=s&255; state=state<4?0:state<10?state-3:state-6; continue;
    }
    let n;
    if(bit(isRep,state)){
      if(!bit(isRepG0,state)){
        if(!bit(isRep0Long,(state<<4)+ps)){ state=state<7?9:11; out[op]=out[op-r0-1]; op++; continue }
      }else{
        let d;
        if(!bit(isRepG1,state)) d=r1; else { if(!bit(isRepG2,state)) d=r2; else {d=r3; r3=r2} r2=r1 }
        r1=r0; r0=d;
      }
      n=len(repLenC,ps); state=state<7?8:11;
    }else{
      r3=r2; r2=r1; r1=r0;
      n=len(lenC,ps); state=state<7?7:10;
      const slot=tree(posSlot,Math.min(n,3)<<6,6);
      if(slot<4) r0=slot;
      else{
        const nd=(slot>>1)-1; let d=(2|(slot&1))*2**nd;
        if(slot<14) d+=rtree(specPos,d-slot-1,nd);
        else{
          let direct=0;
          for(let i=0;i<nd-4;i++){ range=range>>>1; let b=0; if(code>=range){code-=range;b=1} direct=direct*2+b; if(range<16777216){range*=256; code=code*256+(src[ip++]||0)} }
          d+=direct*16+rtree(align,0,4);
        }
        if(d>=0xFFFFFFFF) break;
        r0=d;
      }
    }
    for(n+=2;n>0&&op<outLen;n--,op++) out[op]=out[op-r0-1];
  }
  return out;
}
async function inflateRaw(data){
  if(typeof DecompressionStream==="undefined") throw new Error("このブラウザは CHD の展開に必要な機能に対応していません。iPhone は iOS 16.4 以降にしてください（.bin なら読めます）");
  const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
class ChdDisc{
  constructor(file){this.file=file;this.cache=new Map()}
  async bytes(off,n){return new Uint8Array(await this.file.slice(off,off+n).arrayBuffer())}
  async init(){
    const h=await this.bytes(0,124), dv=new DataView(h.buffer);
    if(String.fromCharCode(...h.subarray(0,8))!=="MComprHD") throw new Error("CHD ファイルとして読めませんでした");
    if(dv.getUint32(12)!==5) throw new Error("この版の CHD にはまだ対応していません（v5 のみ）");
    this.codecs=[0,1,2,3].map(i=>String.fromCharCode(...h.subarray(16+i*4,20+i*4)).replace(/\0/g,""));
    const logical=Number(dv.getBigUint64(32)), mapoff=Number(dv.getBigUint64(40));
    this.hunkBytes=dv.getUint32(56); this.unitBytes=dv.getUint32(60);
    if(dv.getBigUint64(104)|dv.getBigUint64(112)) throw new Error("差分形式（親ファイルが必要）の CHD には対応していません");
    if(!this.codecs[0]) throw new Error("非圧縮の CHD にはまだ対応していません");
    const count=Math.ceil(logical/this.hunkBytes);
    const mh=await this.bytes(mapoff,16), mdv=new DataView(mh.buffer);
    const mapLen=mdv.getUint32(0), lengthBits=mh[12], selfBits=mh[13], parentBits=mh[14];
    let cur=mdv.getUint32(4)*65536+mdv.getUint16(8);
    const br=new MsbBits(await this.bytes(mapoff+16,mapLen)), dec=huffmanFromRle(br,16,8);
    const types=new Uint8Array(count);
    for(let i=0,last=0,rep=0;i<count;i++){
      if(rep>0){types[i]=last;rep--;continue}
      const v=dec();
      if(v===7){types[i]=last;rep=2+dec()}
      else if(v===8){types[i]=last;rep=2+16+(dec()<<4);rep+=dec()}
      else types[i]=last=v;
    }
    this.map=[];
    for(let i=0,lastSelf=0;i<count;i++){
      let t=types[i], off=0, len=0;
      if(t<=3){len=br.read(lengthBits);off=cur;cur+=len;br.read(16)}
      else if(t===4){len=this.hunkBytes;off=cur;cur+=len;br.read(16)}
      else if(t===5){off=lastSelf=br.read(selfBits)}
      else if(t===9||t===10){if(t===10)lastSelf++;t=5;off=lastSelf}
      else throw new Error("親ファイルを参照する CHD には対応していません");
      this.map.push([t,off,len]);
    }
    const f0=await this.hunk(0);
    this.dataOff=f0[15]===1?16:24;
  }
  async hunk(i){
    if(this.cache.has(i)) return this.cache.get(i);
    const [t,off,len]=this.map[i]; let out;
    if(t===5) out=await this.hunk(off);
    else if(t===4) out=await this.bytes(off,len);
    else{
      const src=await this.bytes(off,len), codec=this.codecs[t], hb=this.hunkBytes;
      if(!/^cd(lz|zl)$/.test(codec)) throw new Error(`この圧縮形式（${codec}）の部分はまだ読めません`);
      const frames=hb/2448, eccBytes=(frames+7)>>3, clBytes=hb<65536?2:3;
      let cl=0; for(let k=0;k<clBytes;k++) cl=cl*256+src[eccBytes+k];
      const body=src.subarray(eccBytes+clBytes,eccBytes+clBytes+cl);
      const sect=codec==="cdlz"?lzmaDecode(body,frames*2352):await inflateRaw(body);
      out=new Uint8Array(hb);
      for(let f=0;f<frames;f++) out.set(sect.subarray(f*2352,(f+1)*2352),f*2448);
    }
    if(this.cache.size>64) this.cache.delete(this.cache.keys().next().value);
    this.cache.set(i,out); return out;
  }
  async read(lba,count){
    const out=new Uint8Array(count*2048);
    for(let k=0;k<count;k++){
      const pos=(lba+k)*this.unitBytes, h=await this.hunk(Math.floor(pos/this.hunkBytes)), o=pos%this.hunkBytes;
      out.set(h.subarray(o+this.dataOff,o+this.dataOff+2048),k*2048);
    }
    return out;
  }
  async readRaw(lba){ const pos=lba*this.unitBytes, h=await this.hunk(Math.floor(pos/this.hunkBytes)), o=pos%this.hunkBytes; return h.subarray(o,o+2352) }
  async rootFiles(){return BinDisc.prototype.rootFiles.call(this)}
}

// ============================================================
//  ReBoot のモデル（.TOM）・動き（.NAN）・テクスチャ（.PSH）
// ============================================================
function dv(u8){ return new DataView(u8.buffer,u8.byteOffset,u8.byteLength) }

function parseTom(d){
  const v=dv(d), U=o=>v.getUint32(o,true), I=o=>v.getInt32(o,true), S=o=>v.getInt16(o,true);
  const hdr=U(0), vofs=U(8), vnum=U(0xc), fofs=U(0x10), fnum=U(0x14);
  const jstart=U(0x18), nj=U(0x1c), jend=U(0x38);
  // 関節レコードの刻みと名前の位置を見つける（モデルによって 0x40/0x58、名前は +0x20/+0x38）
  const looksName=o=>{
    const b=d.subarray(o,o+16); if(!b.length) return false;
    const c=b[0]; if(!((c>=65&&c<=90)||(c>=97&&c<=122))) return false;
    let z=b.indexOf(0); if(z<1) return false;
    for(let i=0;i<z;i++) if(b[i]<33||b[i]>126) return false;
    for(let i=z;i<16;i++) if(b[i]!==0) return false;
    return true;
  };
  let stride=0x40, noff=0x20;
  outer: for(const st of [0x40,0x48,0x50,0x58,0x60,0x68,0x70,0x78,0x80]){
    if(!(nj*st<=jend-jstart && jend-jstart<nj*st+8)) continue;
    for(const no of [0x20,0x28,0x30,0x38,0x40]){
      if(no+16>st) continue;
      let ok=true; for(let k=0;k<nj;k++) if(!looksName(jstart+st*k+no)){ ok=false; break }
      if(ok){ stride=st; noff=no; break outer }
    }
  }
  const J=[];
  for(let k=0;k<nj;k++){
    const o=jstart+stride*k;
    let nm=''; for(let i=0;i<16;i++){ const c=d[o+noff+i]; if(!c) break; nm+=String.fromCharCode(c) }
    J.push({name:nm,pos:[S(o),S(o+2),S(o+4)],vnum:I(o+8),src:I(o+0xc),
            child:I(o+0x10),sib:I(o+0x14),dst:I(o+0x18)});
  }
  const V=[]; for(let k=0;k<vnum;k++){ const o=vofs+8*k; V.push([S(o),S(o+2),S(o+4)]) }
  // 面の束（関節ごとの面数）
  const tail=hdr-0x1c;
  let ng=U(tail); if(!(ng>0&&ng<=(tail-0x64)/4)) ng=(tail-0x64)>>2;
  const cnts=[]; for(let k=0;k<ng;k++) cnts.push(U(0x64+4*k));
  while(cnts.length && cnts.reduce((a,b)=>a+b,0)>fnum) cnts.pop();
  // 置き場の表（節7）。関節が持つ頂点を並べた順で引く
  const s7=U(0x40+7*4), n7=(U(0x40+8*4)-s7)>>2;
  const raw=[]; for(let k=0;k<n7;k++) raw.push(v.getUint16(s7+4*k,true)>>2);
  const owned=[];
  for(const j of J) if(j.vnum>0) for(let k=0;k<j.vnum;k++) owned.push(j.src+k);
  owned.sort((a,b)=>a-b);
  const slot={}; owned.forEach((si,i)=>{ if(i<raw.length) slot[si]=raw[i] });
  return {hdr,V,J,cnts,slot,vnum,fnum,fofs,s0:U(0x40),s4:U(0x50),s5:U(0x54),s6:U(0x58),d};
}

/* 面の角ごとに (頂点番号, 関節番号, UV, テクスチャ名) を確定させる */
function resolveTom(t){
  const d=t.d, order=t.J.map((j,i)=>i).filter(i=>t.J[i].vnum>0).sort((a,b)=>t.J[a].src-t.J[b].src);
  const slots={}; let out=[];
  for(let rep=0;rep<2;rep++){
    out=[]; let p=0;
    t.cnts.forEach((c,g)=>{
      const ji=order[g], j=t.J[ji];
      if(j) for(let k=0;k<j.vnum;k++){ const si=j.src+k;
        if(si>=0 && si<t.V.length && (si in t.slot)) slots[t.slot[si]]=[si,ji] }
      for(let f=p;f<p+c;f++){
        const tri=[0,1,2].map(k=>slots[d[t.s0+4*f+k]]);
        if(tri.some(x=>!x)){ out.push(null); continue }
        let nm=''; for(const b of [d[t.s4+4*f+2],d[t.s4+4*f+3],d[t.s5+4*f+2],d[t.s5+4*f+3]]) nm+=String.fromCharCode(b);
        out.push({tri,name:nm,uv:[[d[t.s4+4*f],d[t.s4+4*f+1]],[d[t.s5+4*f],d[t.s5+4*f+1]],[d[t.s6+4*f],d[t.s6+4*f+1]]]});
      }
      p+=c;
    });
  }
  return out;
}

function parseNan(d,njoint){
  const v=dv(d), U=o=>v.getUint32(o,true), H=o=>v.getUint16(o,true), S=o=>v.getInt16(o,true);
  const n=U(0), nj0=U(4), out=[];
  for(let k=0;k<n;k++){
    const o=0x14+40*k;
    let nm=''; for(let i=0;i<16;i++){ const c=d[o+i]; if(!c) break; nm+=String.fromCharCode(c) }
    const frames=U(o+16), nkey=U(o+20), nj=U(o+24), keyofs=U(o+28), poseofs=U(o+32);
    const keys=[]; for(let i=0;i<frames;i++) keys.push([H(keyofs+4*i),H(keyofs+4*i+2)]);
    const stride=8*nj+8, poses=[];
    for(let i=0;i<nkey;i++){
      const b=poseofs+stride*i; if(b+stride>d.length) break;
      const p=[]; for(let q=0;q<njoint;q++) p.push(q<nj?[S(b+8+8*q),S(b+8+8*q+2),S(b+8+8*q+4),S(b+8+8*q+6)]:[16384,0,0,0]);
      poses.push(p);
    }
    if(poses.length) out.push({name:nm,keys,poses});
  }
  return out;
}

function parsePsh(d){
  const v=dv(d), U=o=>v.getUint32(o,true), H=o=>v.getUint16(o,true);
  const n=U(8), out={};
  for(let k=0;k<n;k++){
    let nm=''; for(let i=0;i<4;i++) nm+=String.fromCharCode(d[0x10+8*k+i]);
    const o=U(0x14+8*k);
    if(o+16>d.length) continue;
    const flag=U(o), w=H(o+4), h=H(o+6), pos=U(o+12);
    let nb=(flag>>>16)*256; if(!nb) nb=w*h>>1;
    const bpp=(w*h&&nb>=w*h)?8:4;
    const px=d.subarray(o+16,o+16+nb);
    let clut=null; const c=o+16+nb;
    if(c+16<=d.length){
      const cf=U(c)&0xffff, cw=H(c+4), ch=H(c+6);
      if((cf===0x23||cw===16||cw===256)&&c+16+2*cw*ch<=d.length){
        clut=[]; for(let i=0;i<cw*ch;i++) clut.push(H(c+16+2*i));
      }
    }
    out[nm]={w,h,bpp,px,clut,vram:[pos&0xffff,pos>>>16]};
  }
  return out;
}

/* 色番号0は透明。PS1 の BGR555 */
function pshPixels(e){
  const {w,h,bpp,px,clut}=e, out=new Uint8Array(w*h*4);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let i;
    if(bpp===4){ const k=(y*w+x)>>1; if(k>=px.length) continue; i=(x&1)?(px[k]>>4):(px[k]&15) }
    else { const k=y*w+x; if(k>=px.length) continue; i=px[k] }
    if(!i) continue;
    const c=(clut&&i<clut.length)?clut[i]:0, o=(y*w+x)*4;
    out[o]=(c&31)*255/31|0; out[o+1]=((c>>5)&31)*255/31|0; out[o+2]=((c>>10)&31)*255/31|0; out[o+3]=255;
  }
  return out;
}

// ============================================================
//  アトラスとメッシュの組み立て
// ============================================================
const NILTEX = "␀nil";
function buildAtlas(tex,pad){
  pad = pad||1;
  const nil={w:4,h:4,rgba:(function(){const a=new Uint8Array(64);a.fill(255);return a})()};
  const items=Object.entries(tex).concat([[NILTEX,nil]]).sort((a,b)=>b[1].h-a[1].h);
  const W=256; let x=0,y=0,rowh=0; const place={};
  for(const [n,e] of items){
    const tw=e.w+2*pad, th=e.h+2*pad;
    if(x+tw>W){ x=0; y+=rowh; rowh=0 }
    place[n]=[x+pad,y+pad,e.w,e.h]; x+=tw; rowh=Math.max(rowh,th);
  }
  let H=y+rowh; H=Math.max(1,1<<(32-Math.clz32(Math.max(1,H-1))));
  const buf=new Uint8Array(W*H*4);
  for(const [n,e] of items){
    const p=place[n], ox=p[0], oy=p[1], w=p[2], h=p[3];
    for(let j=-pad;j<h+pad;j++){
      const sj=Math.min(h-1,Math.max(0,j));
      for(let i=-pad;i<w+pad;i++){
        const si=Math.min(w-1,Math.max(0,i)), s=(sj*w+si)*4;
        if(!e.rgba[s+3]) continue;
        const yy=oy+j, xx=ox+i; if(yy<0||yy>=H||xx<0||xx>=W) continue;
        const o=(yy*W+xx)*4;
        buf[o]=e.rgba[s]; buf[o+1]=e.rgba[s+1]; buf[o+2]=e.rgba[s+2]; buf[o+3]=255;
      }
    }
  }
  return {W:W,H:H,buf:buf,place:place};
}

function buildModel(tom,faces,tex,anims){
  const A=buildAtlas(tex), place=A.place;
  const pos=[],bone=[],uv=[];
  for(const f of faces){
    if(!f) continue;
    const p=place[f.name]||place[NILTEX];
    const ax=p[0], ay=p[1], aw=p[2], ah=p[3];
    for(let c=0;c<3;c++){
      const vi=f.tri[c][0], ji=f.tri[c][1], v=tom.V[vi]||[0,0,0];
      pos.push(v[0],v[1],v[2]); bone.push(ji);
      uv.push((ax+((f.uv[c][0]*aw/256)|0)+0.5)/A.W,(ay+((f.uv[c][1]*ah/256)|0)+0.5)/A.H);
    }
  }
  return {joints:tom.J,pos:new Float32Array(pos),bone:new Float32Array(bone),
          uv:new Float32Array(uv),atlas:A,anims:anims};
}

// ============================================================
//  ディスクの中を歩く
// ============================================================
async function readDir(disc,lba,size){
  const buf=await disc.read(lba,Math.ceil(size/2048)), d=new DataView(buf.buffer);
  const out={}; let i=0;
  while(i<size){
    const len=buf[i];
    if(len===0){ i=(Math.floor(i/2048)+1)*2048; continue }
    const nl=buf[i+32];
    let name=''; for(let k=0;k<nl;k++) name+=String.fromCharCode(buf[i+33+k]);
    name=name.split(';')[0];
    const special=(nl===1&&(buf[i+33]===0||buf[i+33]===1));
    if(!special)
      out[name]={lba:d.getUint32(i+2,true),size:d.getUint32(i+10,true),dir:!!(buf[i+25]&2)};
    i+=len;
  }
  return out;
}
async function readFileAt(disc,ent){
  return (await disc.read(ent.lba,Math.ceil(ent.size/2048))).subarray(0,ent.size);
}

async function openDisc(fileList){
  const files=[...fileList];
  const bin=files.find(f=>/\.(chd|bin|iso|img)$/i.test(f.name))||files[0];
  if(!bin) throw new Error('ファイルが選ばれていません');
  if(/\.cue$/i.test(bin.name)) throw new Error('.cue ではなく、同じ名前の .bin を選んでください');
  const magic=String.fromCharCode(...new Uint8Array(await bin.slice(0,8).arrayBuffer()));
  const disc=magic==='MComprHD'?new ChdDisc(bin):new BinDisc(bin);
  await disc.init();
  const root=await disc.rootFiles();
  if(!root['SYSTEM.CNF']) throw new Error('PlayStation のディスクイメージではないようです');
  const cnf=new TextDecoder().decode(await disc.read(root['SYSTEM.CNF'].lba,1));
  if(!/SLUS_002\.74/i.test(cnf)) throw new Error('ReBoot（SLUS-00274）のディスクではないようです');
  if(!root['ANIMATE']) throw new Error('ANIMATE フォルダが見つかりません');
  return {disc,root};
}

/* 起動時: モデル一覧と、テクスチャ束の目次だけ集める */
async function scanDisc(src,onProgress){
  const {disc,root}=src;
  const anim=await readDir(disc,root['ANIMATE'].lba,root['ANIMATE'].size);
  const models={};
  for(const n of Object.keys(anim)){
    const m=/^(.+)\.TOM$/i.exec(n); if(!m) continue;
    models[m[1]]={tom:anim[n],nan:anim[m[1]+'.NAN']||null};
  }
  // モデルを下調べして、読めないものを外す
  for(const [n,m] of Object.entries(models)){
    try{
      const raw=await readFileAt(disc,m.tom);
      m.tom2=parseTom(raw);
      m.faces=resolveTom(m.tom2);
      m.need=new Set(); for(const f of m.faces) if(f) m.need.add(f.name);
      if(!m.need.size) delete models[n];
    }catch(e){ delete models[n] }
  }
  // .PSH を探す（DATA/TEXTURES と各ステージのフォルダ）
  const bundles=[];
  const dirs=[{name:'',ent:null,files:root}];
  if(root['DATA']){
    const data=await readDir(disc,root['DATA'].lba,root['DATA'].size);
    for(const [n,e] of Object.entries(data)){
      if(e.dir) dirs.push({name:n,files:await readDir(disc,e.lba,e.size)});
      else if(/\.PSH$/i.test(n)) bundles.push({name:n,ent:e});
    }
  }
  for(const d of dirs)
    for(const [n,e] of Object.entries(d.files))
      if(!e.dir&&/\.PSH$/i.test(n)) bundles.push({name:(d.name?d.name+'/':'')+n,ent:e});
  // 各束の目次（名前だけ）を読む
  let done=0;
  for(const b of bundles){
    const head=await disc.read(b.ent.lba,Math.min(4,Math.ceil(b.ent.size/2048)));
    const v=new DataView(head.buffer);
    if(String.fromCharCode(head[0],head[1],head[2],head[3])!=='SHPP'){ b.names=new Set(); continue }
    const n=v.getUint32(8,true), names=new Set();
    for(let k=0;k<n&&0x10+8*k+8<=head.length;k++){
      let nm=''; for(let i=0;i<4;i++) nm+=String.fromCharCode(head[0x10+8*k+i]);
      names.add(nm);
    }
    b.names=names;
    if(onProgress) onProgress(++done,bundles.length);
  }
  return {models,bundles};
}

/* モデル1体を読み込む */
async function loadOne(src,lib,name,onProgress){
  const {disc}=src, m=lib.models[name];
  const tom=m.tom2, faces=m.faces, need=m.need;
  // 名前を一番多く持っている束から順に使う
  const order=lib.bundles.slice().sort((a,b)=>{
    const ca=[...need].filter(n=>a.names.has(n)).length, cb=[...need].filter(n=>b.names.has(n)).length;
    return cb-ca;
  });
  const tex={}; const missing=new Set(need);
  for(const b of order){
    if(!missing.size) break;
    if(![...missing].some(n=>b.names.has(n))) continue;
    if(!b.cache){
      if(onProgress) onProgress('テクスチャ '+b.name);
      b.cache=parsePsh(await readFileAt(disc,b.ent));
    }
    for(const n of [...missing]) if(b.cache[n]){
      const e=b.cache[n]; tex[n]={w:e.w,h:e.h,rgba:pshPixels(e)}; missing.delete(n);
    }
  }
  let anims=[];
  if(m.nan){
    try{ anims=parseNan(await readFileAt(disc,m.nan),tom.J.length) }catch(e){ anims=[] }
  }
  if(!anims.length){
    // 同じ系統の動きファイルを借りる（ENZOGUN → ENZO など）
    for(const alt of ['BOB2','ENZO','MBYTE','GLITCH','HEXADEC','GBINBODY','ZEROBINO','CLASH','WEB','SLUG'])
      if(lib.models[alt]&&lib.models[alt].nan&&alt.slice(0,3)===name.slice(0,3)){
        try{ anims=parseNan(await readFileAt(disc,lib.models[alt].nan),tom.J.length) }catch(e){}
        break;
      }
  }
  const model=buildModel(tom,faces,tex,anims);
  model.missing=[...missing];
  model.name=name;
  return model;
}

function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array(
  [-t/a,0,0,0, 0,t,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0])}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function lookAt(e,c,u){
  const z=nrm(sub(e,c)), x=nrm(cross(u,z)), y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,e),-dot(y,e),-dot(z,e),1])}

function qmat(q){
  const w=q[0],x=q[1],y=q[2],z=q[3];
  return [1-2*(y*y+z*z), 2*(x*y+w*z), 2*(x*z-w*y),
          2*(x*y-w*z), 1-2*(x*x+z*z), 2*(y*z+w*x),
          2*(x*z+w*y), 2*(y*z-w*x), 1-2*(x*x+y*y)]}
function m3mul(a,b){const o=new Array(9);
  for(let c=0;c<3;c++)for(let r=0;r<3;r++){let s=0;for(let k=0;k<3;k++)s+=a[k*3+r]*b[c*3+k];o[c*3+r]=s}return o}
function m3v(a,v){return [a[0]*v[0]+a[3]*v[1]+a[6]*v[2], a[1]*v[0]+a[4]*v[1]+a[7]*v[2], a[2]*v[0]+a[5]*v[1]+a[8]*v[2]]}

let M=null, mesh=null, tex=null;

const state={yaw:FRONT,pitch:0.15,dist:2.6,playing:true,anim:0,frame:0,speed:1,t:0};

function poseAt(anim){
  if(!anim||!anim.poses.length) return M.joints.map(()=>[1,0,0,0]);
  const k=anim.keys[Math.min(state.frame,anim.keys.length-1)]||[0,0];
  const i=Math.min(k[0],anim.poses.length-1), t=(k[1]||0)/128;
  const a=anim.poses[i], b=anim.poses[Math.min(i+1,anim.poses.length-1)];
  return a.map((q,j)=>{
    const p=b[j], s=(q[0]*p[0]+q[1]*p[1]+q[2]*p[2]+q[3]*p[3])<0?-1:1;
    const o=[q[0]+(p[0]*s-q[0])*t, q[1]+(p[1]*s-q[1])*t, q[2]+(p[2]*s-q[2])*t, q[3]+(p[3]*s-q[3])*t];
    const l=Math.hypot(o[0],o[1],o[2],o[3])||1;
    return [o[0]/l,o[1]/l,o[2]/l,o[3]/l];
  });
}
function buildBones(quats){
  const J=M.joints, n=J.length, out=new Float32Array(48*16);
  let c=0;
  (function walk(i,R,T){
    while(i>=0&&i<n){
      const q=quats[c++]||[1,0,0,0];
      const r=m3mul(R,qmat(q));
      const off=m3v(R,J[i].pos);
      const t=[T[0]+off[0],T[1]+off[1],T[2]+off[2]];
      const o=i*16;
      out[o]=r[0];out[o+1]=r[1];out[o+2]=r[2];
      out[o+4]=r[3];out[o+5]=r[4];out[o+6]=r[5];
      out[o+8]=r[6];out[o+9]=r[7];out[o+10]=r[8];
      out[o+12]=t[0];out[o+13]=t[1];out[o+14]=t[2];out[o+15]=1;
      if(J[i].child>=0) walk(J[i].child,r,t);
      i=J[i].sib;
    }
  })(0,[1,0,0,0,1,0,0,0,1],[0,0,0]);
  return out;
}
function measure(){
  const B=buildBones(poseAt(M.anims[state.anim]));

    const b=M.bone[i]*16, x=M.pos[i*3],y=M.pos[i*3+1],z=M.pos[i*3+2];
    const p=[B[b]*x+B[b+4]*y+B[b+8]*z+B[b+12],
             B[b+1]*x+B[b+5]*y+B[b+9]*z+B[b+13],
             B[b+2]*x+B[b+6]*y+B[b+10]*z+B[b+14]];
    for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k])}

}
function setFilter(){

  measure();
  $('meta').innerHTML='三角形 <b>'+(d.bone.length/3)+'</b><br>関節 <b>'+d.joints.length+'</b><br>動き <b>'+d.anims.length+'</b>'
    +(d.missing&&d.missing.length?'<br><span style="color:#e5736b">テクスチャ不足: '+d.missing.join(', ')+'</span>':'');
}
function setAnim(i){
  state.anim=i; state.frame=0; state.t=0;
  const a=M.anims[i], n=a?Math.max(1,a.keys.length):1;
  $('frame').max=n-1; $('frame').value=0;
  if(M.center) measure();
}

let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  state.yaw+=(e.clientX-drag[0])*0.01;
  state.pitch=Math.max(-1.3,Math.min(1.3,state.pitch+(e.clientY-drag[1])*0.01));
  drag=[e.clientX,e.clientY]});
addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();
  state.dist=Math.max(0.6,Math.min(9,state.dist*(1+e.deltaY*0.0012)))},{passive:false});
$('play').onclick=()=>{state.playing=!state.playing;$('play').textContent=state.playing?'停止':'再生'};
$('reset').onclick=()=>{state.yaw=FRONT;state.pitch=0.15;state.dist=2.6};
$('frame').oninput=e=>{state.playing=false;$('play').textContent='再生';state.frame=+e.target.value};
$('speed').oninput=e=>{state.speed=+e.target.value/100;$('spd').textContent=state.speed.toFixed(1)+'×'};
$('anim').onchange=e=>setAnim(+e.target.value);
$('smooth').onchange=setFilter;

function resize(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  const w=Math.max(1,r.width*dpr|0), h=Math.max(1,r.height*dpr|0);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h }
  gl.viewport(0,0,cv.width,cv.height);
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!M||!mesh) return;
  const dt=Math.min(0.1,(ts-last)/1000); last=ts;
  const a=M.anims[state.anim];
  if(state.playing&&a&&a.keys.length){
    state.t+=dt*30*state.speed;
    if(state.t>=1){ state.frame=(state.frame+Math.floor(state.t))%a.keys.length; state.t%=1;
      $('frame').value=state.frame }
  }
  $('fno').textContent=(a&&a.keys.length)?(state.frame+1)+' / '+a.keys.length:'—';
  resize();
  gl.clearColor(0.067,0.075,0.102,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  // 裏を向いた面は描かない（外向き＝反時計回り）。線画のときは全部出す
  if($('wire').checked) gl.disable(gl.CULL_FACE);
  else { gl.enable(gl.CULL_FACE); gl.frontFace(gl.CW); gl.cullFace(gl.BACK) }
  const s=M.scale, c=M.center||[0,0,0];
  const eye=[Math.sin(state.yaw)*Math.cos(state.pitch),-Math.sin(state.pitch),Math.cos(state.yaw)*Math.cos(state.pitch)]
    .map((v,i)=>v*s*state.dist+c[i]);
  gl.uniformMatrix4fv(U.proj,false,persp(0.9,cv.width/cv.height,s*0.05,s*40));
  gl.uniformMatrix4fv(U.view,false,lookAt(eye,c,[0,-1,0]));
  gl.uniformMatrix4fv(U.bone,false,buildBones(poseAt(a)));
  gl.uniform1f(U.flat,$('wire').checked?1:0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(U.tex,0);
  const w=$('wire').checked;
  gl.bindBuffer(gl.ARRAY_BUFFER,w?mesh.lp:mesh.p); gl.enableVertexAttribArray(A.pos); gl.vertexAttribPointer(A.pos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,w?mesh.lu:mesh.u); gl.enableVertexAttribArray(A.uv);  gl.vertexAttribPointer(A.uv,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,w?mesh.lb:mesh.b); gl.enableVertexAttribArray(A.bone);gl.vertexAttribPointer(A.bone,1,gl.FLOAT,false,0,0);
  gl.drawArrays(w?gl.LINES:gl.TRIANGLES,0,w?mesh.ln:mesh.n);
}
requestAnimationFrame(frame);

// ============================================================
//  読み込みの流れ
// ============================================================
let SRC=null, LIB=null;
const say=(t,bad)=>{const s=$('status');s.textContent=t;s.className=bad?'bad':''};
const busy=t=>{const b=$('busy'); if(t){b.textContent=t;b.classList.add('on')} else b.classList.remove('on')};

async function start(files){
  try{
    say('ディスクを開いています…');
    SRC=await openDisc(files);
    say('中身を調べています…');
    LIB=await scanDisc(SRC,(a,b)=>say('テクスチャの目次を読んでいます… '+a+' / '+b));
    const names=Object.keys(LIB.models).sort();
    if(!names.length) throw new Error('モデルが見つかりませんでした');
    const ms=$('model'); ms.innerHTML='';
    names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;ms.appendChild(o)});
    ms.value=names.includes('ENZO')?'ENZO':names[0];
    ms.onchange=()=>pick(ms.value);
    $('discName').textContent=(files[0]&&files[0].name)||'';
    $('intro').style.display='none';
    $('app').classList.add('on');
    await pick(ms.value);
  }catch(e){ say(String(e.message||e),true) }
}
async function pick(name){
  busy('読み込み中…');
  try{
    await new Promise(r=>setTimeout(r,16));
    const m=await loadOne(SRC,LIB,name,t=>busy(t));
    useModel(m);
  }catch(e){ busy(''); alert('読み込めませんでした: '+(e.message||e)); return }
  busy('');
}

const drop=$('drop');
drop.addEventListener('click',()=>$('file').click());
$('pick').addEventListener('click',e=>{e.stopPropagation();$('file').click()});
$('file').addEventListener('change',e=>{ if(e.target.files.length) start(e.target.files) });
for(const ev of ['dragenter','dragover']) drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});
for(const ev of ['dragleave','drop']) drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')});
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) start(e.dataTransfer.files) });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>e.preventDefault());

</script>
